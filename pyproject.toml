[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guiml-bench"
version = "0.1.0"
description = "A rule-taxonomy benchmark for design-system-governed UI generation, plus the GUIML representation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daphne Cheng", email = "dcheng81@gatech.edu" }]
keywords = ["design-systems", "generative-ui", "benchmark", "hci", "carbon"]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "rich>=13.7",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
hf = ["huggingface_hub>=0.26", "datasets>=3.0", "gradio>=5.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
guiml-bench = "guiml_bench.cli:main"

[tool.setuptools.packages.find]
include = ["guiml_bench*", "guiml*"]

[tool.setuptools.package-data]
guiml = ["*.json"]
guiml_bench = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py310"
