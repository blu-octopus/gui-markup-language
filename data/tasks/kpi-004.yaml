id: kpi-004
domain: finance
pattern: kpi-grid
difficulty: 3
trap: []
prompt: 'Design an overview of four ledger metrics for treasury operators: settlement
  volume, open wire transfers, failures in the last day, and median age. Each metric
  is a card with a title, a large number, and a percentage change. Four columns on
  a wide screen, one column on a narrow screen.'
