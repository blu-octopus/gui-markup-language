id: tbl-010
domain: finance
pattern: table
difficulty: 1
trap:
- lifecycle
prompt: Build a view for treasury operators listing pending wire transfers. Include
  the wire transfer name, owner, status, and last updated time. Users must select
  several rows and approve them together. Provide a search field above the list. Use
  the ui-background color for the page canvas.
scales:
- M
- L
expected_components:
- DataTable
- TableToolbar
- TableBatchActions
- Tag
- Search
- Button
- Grid
- Column
expected_tokens:
- background
- button-danger-primary
- button-primary
- button-secondary
- container-04
- layer-01
- spacing-05
- spacing-06
- support-error
- support-success
- support-warning
- text-helper
- text-primary
- text-secondary
forbidden:
- kind: token
  name: ui-background
  reason: renamed/split in v11 -> background
  expect: background
checkpoints:
- id: no-raw-hex
  rule_class: R1
  text: No raw hex, rgb(), or hsl() colors; values bind to tokens.
  critical: false
- id: expected-tokens
  rule_class: R1
  text: Expected tokens for this task are present.
  critical: false
- id: text-role
  rule_class: R1
  text: Body and helper copy use text-primary / text-secondary (or text-helper), not
    a single color for both.
  critical: false
- id: catalog-only
  rule_class: R2
  text: Only catalog components from the presented pack are imported.
  critical: true
- id: compiles
  rule_class: R2
  text: TypeScript compiles against @carbon/react.
  critical: false
- id: grid-composition
  rule_class: R2
  text: Layout uses Grid with Column children.
  critical: false
- id: table-parts
  rule_class: R2
  text: The table has a head and a body.
  critical: false
- id: status-as-tag
  rule_class: R3
  text: Row status is a Tag, not a Button or unstyled text.
  critical: true
- id: one-primary
  rule_class: R3
  text: The batch {action} control is the only primary button.
  critical: false
- id: no-critical-axe
  rule_class: R4
  text: No critical or serious axe-core violations at 1440 or 375.
  critical: true
- id: labels
  rule_class: R4
  text: Every text input and icon-only control has an accessible name.
  critical: false
- id: grid-used
  rule_class: R6
  text: A responsive grid (or equivalent pack layout primitive) is used.
  critical: false
- id: no-overlap-375
  rule_class: R6
  text: No overlapping boxes and no horizontal overflow at 375px.
  critical: false
- id: no-ui-background
  rule_class: R5
  text: Does not use the v10 name `ui-background`; uses `background` (or a valid v11
    role token).
  critical: true
- id: no-v10-package
  rule_class: R5
  text: Does not import carbon-components-react.
  critical: false
gold: null
