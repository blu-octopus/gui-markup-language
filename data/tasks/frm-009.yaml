id: frm-009
domain: admin
pattern: form
difficulty: 1
trap:
- lifecycle
prompt: Create a two-column intake form that workspace admins use to register a new
  member. Collect a display name, an email, a numeric identifier, and a notes field.
  Show inline validation on the identifier. Primary action submits; a secondary action
  cancels. Helper copy under each field should use the text-02 color.
scales:
- S
- M
- L
expected_components:
- Form
- TextInput
- TextArea
- NumberInput
- Button
- ButtonSet
- Grid
- Column
expected_tokens:
- background
- button-primary
- button-secondary
- container-04
- layer-01
- spacing-05
- spacing-06
- support-error
- support-success
- support-warning
- text-helper
- text-primary
- text-secondary
forbidden:
- kind: token
  name: text-02
  reason: renamed/split in v11 -> text-secondary
  expect: text-secondary
checkpoints:
- id: no-raw-hex
  rule_class: R1
  text: No raw hex, rgb(), or hsl() colors; values bind to tokens.
  critical: false
- id: expected-tokens
  rule_class: R1
  text: Expected tokens for this task are present.
  critical: false
- id: text-role
  rule_class: R1
  text: Body and helper copy use text-primary / text-secondary (or text-helper), not
    a single color for both.
  critical: false
- id: catalog-only
  rule_class: R2
  text: Only catalog components from the presented pack are imported.
  critical: true
- id: compiles
  rule_class: R2
  text: TypeScript compiles against @carbon/react.
  critical: false
- id: grid-composition
  rule_class: R2
  text: Layout uses Grid with Column children.
  critical: false
- id: one-primary
  rule_class: R3
  text: Exactly one primary button (submit); cancel is secondary.
  critical: true
- id: validation-inline
  rule_class: R3
  text: Identifier validation is inline on the field, not a modal.
  critical: false
- id: no-critical-axe
  rule_class: R4
  text: No critical or serious axe-core violations at 1440 or 375.
  critical: true
- id: labels
  rule_class: R4
  text: Every text input and icon-only control has an accessible name.
  critical: false
- id: grid-used
  rule_class: R6
  text: A responsive grid (or equivalent pack layout primitive) is used.
  critical: false
- id: no-overlap-375
  rule_class: R6
  text: No overlapping boxes and no horizontal overflow at 375px.
  critical: false
- id: no-text-02
  rule_class: R5
  text: Does not use the v10 name `text-02`; uses `text-secondary` (or a valid v11
    role token).
  critical: true
- id: no-v10-package
  rule_class: R5
  text: Does not import carbon-components-react.
  critical: false
gold: null
