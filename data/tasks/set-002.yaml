id: set-002
domain: admin
pattern: settings
difficulty: 3
trap: []
prompt: A settings page for the workspace used by workspace admins. Sections for profile,
  notifications, and danger zone. Profile has display name and email. Notifications
  is a switch. Danger zone deactivates the workspace after a typed confirmation.
scales:
- M
- L
expected_components:
- Tabs
- TabList
- Tab
- TextInput
- Toggle
- Button
- Grid
- Column
expected_tokens:
- background
- button-danger-primary
- button-primary
- button-secondary
- container-04
- layer-01
- spacing-05
- spacing-06
- support-error
- support-success
- support-warning
- text-helper
- text-primary
- text-secondary
forbidden: []
checkpoints:
- id: no-raw-hex
  rule_class: R1
  text: No raw hex, rgb(), or hsl() colors; values bind to tokens.
  critical: false
- id: expected-tokens
  rule_class: R1
  text: Expected tokens for this task are present.
  critical: false
- id: text-role
  rule_class: R1
  text: Body and helper copy use text-primary / text-secondary (or text-helper), not
    a single color for both.
  critical: false
- id: catalog-only
  rule_class: R2
  text: Only catalog components from the presented pack are imported.
  critical: true
- id: compiles
  rule_class: R2
  text: TypeScript compiles against @carbon/react.
  critical: false
- id: grid-composition
  rule_class: R2
  text: Layout uses Grid with Column children.
  critical: false
- id: danger-zone
  rule_class: R3
